<script src="/js/livecodes.umd.js"></script>
<script>
  // Initialize LiveCodes playgrounds
  (async () => {
    if (typeof livecodes === 'undefined') {
      console.error('LiveCodes library not loaded');
      return;
    }

    // Detect editor type based on language
    function getEditorType(lang) {
      const markupLangs = ['html', 'markdown', 'md', 'pug', 'haml', 'asciidoc', 'astro', 'mdx', 'mjml', 'bbcode'];
      const styleLangs = ['css', 'scss', 'sass', 'less', 'stylus', 'postcss', 'tailwindcss', 'unocss', 'windicss'];
      
      const lowerLang = lang.toLowerCase();
      if (markupLangs.includes(lowerLang)) return 'markup';
      if (styleLangs.includes(lowerLang)) return 'style';
      return 'script';
    }

    const playgrounds = document.querySelectorAll('.livecodes-playground');
    
    for (const container of playgrounds) {
      const lang = container.dataset.lang;
      const codeElement = container.querySelector('pre code');
      const code = codeElement ? codeElement.textContent : '';
      
      // Remove the loading message and pre element
      container.innerHTML = '';
      
      // Detect the correct editor type for the language
      const editorType = getEditorType(lang);
      
      // Create the playground with proper language configuration
      await livecodes.createPlayground(container, {
        config: {
          mode: 'full',
          activeEditor: editorType,
          [editorType]: {
            language: lang,
            content: code
          }
        }
      });
    }
  })();
</script>

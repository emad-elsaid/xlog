version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
    - gocritic
    - gocyclo
    - godot
    - goconst

  settings:
    errcheck:
      check-blank: false
      check-type-assertions: false
    
    govet:
      enable-all: true
      disable:
        - fieldalignment
    
    gocyclo:
      min-complexity: 15
    
    gocritic:
      enabled-checks:
        - appendCombine
        - boolExprSimplify
        - dupImport
        - equalFold
        - httpNoBody
        - importShadow
        - rangeValCopy
        - stringConcatSimplify
        - typeUnparen
        - unnamedResult

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - goconst
          - gocyclo
    paths:
      - markdown/
      - (_benchmark|_tools)/

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8dc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Light background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  
  <!-- Subtle wood grain pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1280" y2="100" stroke="#8B4513" stroke-width="1"/>
    <line x1="0" y1="200" x2="1280" y2="200" stroke="#8B4513" stroke-width="1"/>
    <line x1="0" y1="300" x2="1280" y2="300" stroke="#8B4513" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#8B4513" stroke-width="1"/>
    <line x1="0" y1="500" x2="1280" y2="500" stroke="#8B4513" stroke-width="1"/>
  </g>
  
  <!-- Logo on left (we'll embed the actual logo) -->
  <image x="80" y="120" width="220" height="220" xlink:href="/home/emad/code/xlog/public/logo.png"/>
  
  <!-- Main heading -->
  <text x="350" y="200" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="bold" fill="#2c2c2c">
    XLog
  </text>
  
  <!-- Tagline -->
  <text x="350" y="270" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="400" fill="#4a4a4a">
    Fast, Git-native framework for building knowledge bases
  </text>
  
  <!-- Separator line with natural color -->
  <line x1="350" y1="310" x2="1200" y2="310" stroke="#8B7355" stroke-width="2" opacity="0.4"/>
  
  <!-- Feature badges with earthy tones -->
  <g transform="translate(350, 370)">
    <!-- Fast -->
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#8B7355" opacity="0.15"/>
    <rect x="0" y="0" width="160" height="55" rx="8" fill="none" stroke="#8B7355" stroke-width="2"/>
    <text x="80" y="35" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#5d4e37" text-anchor="middle">Fast</text>
    
    <!-- Git-Native -->
    <rect x="180" y="0" width="190" height="55" rx="8" fill="#6B8E23" opacity="0.15"/>
    <rect x="180" y="0" width="190" height="55" rx="8" fill="none" stroke="#6B8E23" stroke-width="2"/>
    <text x="275" y="35" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#556B2F" text-anchor="middle">Git-Native</text>
    
    <!-- 37 Extensions -->
    <rect x="390" y="0" width="230" height="55" rx="8" fill="#8B7355" opacity="0.15"/>
    <rect x="390" y="0" width="230" height="55" rx="8" fill="none" stroke="#8B7355" stroke-width="2"/>
    <text x="505" y="35" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#5d4e37" text-anchor="middle">37 Extensions</text>
    
    <!-- Backlinks -->
    <rect x="640" y="0" width="180" height="55" rx="8" fill="#6B8E23" opacity="0.15"/>
    <rect x="640" y="0" width="180" height="55" rx="8" fill="none" stroke="#6B8E23" stroke-width="2"/>
    <text x="730" y="35" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#556B2F" text-anchor="middle">Backlinks</text>
  </g>
  
  <!-- Subtitle -->
  <text x="640" y="510" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="300" fill="#6a6a6a" text-anchor="middle">
    Static site generator for digital gardens and personal wikis
  </text>
  
  <!-- Go badge with official color -->
  <g transform="translate(980, 525)">
    <rect x="0" y="0" width="220" height="48" rx="24" fill="#00ADD8" opacity="0.15"/>
    <rect x="0" y="0" width="220" height="48" rx="24" fill="none" stroke="#00ADD8" stroke-width="2"/>
    <text x="110" y="31" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#00ADD8" text-anchor="middle">Written in Go</text>
  </g>
  
  <!-- Decorative elements with natural colors -->
  <circle cx="120" cy="530" r="20" fill="#6B8E23" opacity="0.1"/>
  <circle cx="1180" cy="110" r="25" fill="#8B7355" opacity="0.1"/>
</svg>
